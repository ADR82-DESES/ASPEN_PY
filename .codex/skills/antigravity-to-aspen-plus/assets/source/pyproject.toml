[project]
name = "aspen-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywin32>=311",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pydantic>=2.0",
]

# Development and test dependencies are managed by the supported Pixi workspace
# (see pixi.toml: [dependencies] and [pypi-dependencies]). Pixi is the single
# source of truth for the environment.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: tests that require live Aspen Plus, Windows COM, or local registry access",
]
norecursedirs = [
    ".codex_pytest_tmp*",
    ".git",
    ".pixi",
    ".pixi-cache",
    ".pytest_cache",
    ".pytest_tmp",
    ".tmp_*",
    "build",
    "dist",
    "legacy_old_files",
    "logs",
    "manual_verify_*",
    "process_runs",
    "process_runs_*",
    "pytest-cache-files-*",
    "pytest_tmp",
    "test_results",
]
