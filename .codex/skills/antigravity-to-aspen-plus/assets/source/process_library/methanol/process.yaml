kinetic_models:
- id: VBF96_SCREENING
  description: Methanol-selective RPLUG screening surrogate for Cu/ZnO/Al2O3 synthesis.
  implementation: Aspen POWERLAW reaction set attached to B-SYN RPLUG; not an exact
    LHHW rate-law implementation.
  primary_reference: Vanden Bussche and Froment, Journal of Catalysis 161, 1-10, 1996.
  secondary_reference: Graaf et al., Chemical Engineering Science 43, 3185-3195, 1988.
  calibration_status: uncalibrated screening defaults; activation energies are set
    to 0.0 after live sanity sweep isolated Aspen POWERLAW Arrhenius scaling as the
    cause of near-zero methanol; replace with plant or vendor catalyst data before
    design use.
  excludes: methanation reactions; CH4 is treated as inert through B-SYN.
  campaign_note: Live 10k TPD tuning promoted fresh-feed scale 2.0 with B-SYN
    RPLUG LENGTH 19.613 and DIAM 4.0; CAT-WT remains documented but inactive because
    INP generation does not emit it for RPLUG in this workflow.
process_defaults:
