[project]
name = "aspen-py"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pywin32>=311",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mcp>=1.27.0,<2.0.0",
    "httpx>=0.27.0",
    "pathspec>=1.0.4,<2.0.0",
    "tiktoken>=0.12.0,<0.13.0",
    "tree-sitter-language-pack>=1.5.0,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".codex_pytest_tmp*",
    ".git",
    ".jcodemunch-cache",
    ".pixi",
    ".pixi-cache",
    ".pytest_cache",
    ".pytest_tmp",
    ".tmp_*",
    "archive",
    "build",
    "dist",
    "logs",
    "manual_verify_*",
    "process_runs",
    "process_runs_*",
    "pytest-cache-files-*",
    "pytest_tmp",
    "test_results",
]
