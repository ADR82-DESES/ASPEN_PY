kinetic_models:
- id: VBF96_SCREENING
  description: 2-reaction CO2-based LHHW kinetics (RWGS + CO2 hydrogenation to methanol)
    on B-SYN RPLUG; rate per catalyst weight (RBASIS=CAT-WT), partial-pressure basis.
  implementation: Aspen GENERAL reaction set (LHHW) attached to B-SYN RPLUG; CAT-WT=250000
    kg emitted as CATWT on the reactor block. Constants transcribed from the Aspen V14
    methanol synthesis lab reactor example (docs/superpowers/notes/lhhw_reference.inp),
    Aspen-validated. T-REF is emitted as 228.42 <K> because the source deck is IN-UNITS
    SI while this deck is IN-UNITS MET (deg C); the explicit <K> token preserves the
    correct reference temperature regardless of the active unit set.
  primary_reference: Vanden Bussche and Froment, Journal of Catalysis 161, 1-10, 1996.
  secondary_reference: Graaf et al., Chemical Engineering Science 43, 3185-3195, 1988.
  calibration_status: Constants transcribed verbatim from the Aspen-validated reference
    INP; loop-level physical fidelity still depends on item 1 (EOS) and item 3 (SN
    stoichiometric number optimisation).
  excludes: methanation reactions; CH4 is treated as inert through B-SYN.
  campaign_note: "Live 10k TPD tuning retained: B-SYN RPLUG LENGTH 21.3 and DIAM
    4.0; low-pressure LIGHTS recovery, RADFRAC bottoms rate 82000 kg/hr, and a product
    degassing flash meet production, purity, and low-pressure product gates while
    holding combined vent methanol loss below 10% of the prior LIGHTS-loss baseline."
