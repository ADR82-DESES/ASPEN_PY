[workspace]
name = "aspen-py"
version = "0.1.0"
description = "Pixi environment for Aspen Plus automation and the process library notebook"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = "3.12.*"
pandas = ">=2.0"
pydantic = ">=2.0"
pyyaml = ">=6.0"
pywin32 = ">=311"
pytest = ">=7.0"
pytest-cov = ">=4.0"
ipykernel = ">=6.0"
jupyterlab = ">=4.0"
notebook = ">=7.0"
plotly = ">=5.20"
nbformat = ">=5.9"

[tasks]
lab = "jupyter lab"
notebook = "jupyter notebook"
process-library-notebook = "jupyter lab notebooks/process_library_runner.ipynb"
methanol-example-notebook = "jupyter lab notebooks/methanol_example_runner.ipynb"
install-kernel = "python -m ipykernel install --user --name aspen-py-pixi --display-name \"Python (aspen-py-pixi)\""
test = "pytest tests -q --ignore=tests/integration --basetemp=.codex_pytest_tmp_aspen_all"
test-focused = "pytest tests/unit/test_validator.py tests/unit/test_schema.py tests/contract/test_process_library.py tests/unit/test_batch_engine.py tests/contract/test_notebook_purpose_contract.py -q --basetemp=.codex_pytest_tmp_aspen_focused"
test-live = "pytest tests/integration -q --basetemp=.codex_pytest_tmp_aspen_live"
